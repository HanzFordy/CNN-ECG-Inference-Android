apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.polar.androidblesdk'
    compileSdk 33
    defaultConfig {
        applicationId "com.polar.androidblesdk"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        pickFirst 'org/apache/maven/surefire/shade/org/apache/maven/shared/utils/annotations.xml'
        pickFirst 'META-INF/DEPENDENCIES'
        pickFirst 'META-INF/LICENSE.md'
            pickFirst 'META-INF/LICENSE-notice.md'
    }

}

dependencies {
    implementation 'com.github.polarofficial:polar-ble-sdk:5.5.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.6'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'com.google.ai.edge.litert:litert-support:1.0.1'
    implementation 'com.google.ai.edge.litert:litert:1.3.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.17.0'
    implementation ('com.github.Foxpace:Kotlin-Ecg-Detectors:0.0.4') {
        exclude group: 'org.apache.maven.surefire', module: 'common-java5'
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
